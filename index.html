<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="簡潔好玩的線上擲骰子工具">
  <title>骰來運轉｜擲骰子</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="eyebrow"><span class="eyebrow-dot"></span>ROLL THE DICE</div>
      <h1 id="page-title">骰來運轉</h1>
      <p>讓一點隨機，替今天做個決定。</p>
    </section>

    <section class="game-panel" aria-label="擲骰子工具">
      <div class="panel-heading">
        <div>
          <span class="section-label">DICE ROLLER</span>
          <h2>準備好了嗎？</h2>
        </div>
        <div class="roll-count" aria-live="polite"><strong id="roll-count">0</strong><span>次擲骰</span></div>
      </div>

      <div class="dice-stage" id="dice-stage" aria-live="polite" aria-label="骰子結果"></div>

      <div class="result-bar">
        <div class="result-item"><span>本次總和</span><strong id="total-value">—</strong></div>
        <div class="result-item"><span>平均點數</span><strong id="average-value">—</strong></div>
        <div class="result-item"><span>最高點數</span><strong id="highest-value">—</strong></div>
      </div>

      <div class="controls">
        <label for="dice-number">骰子數量</label>
        <div class="stepper" aria-label="調整骰子數量">
          <button class="stepper-button" id="decrease-dice" type="button" aria-label="減少骰子">−</button>
          <output id="dice-number" aria-live="polite">2</output>
          <button class="stepper-button" id="increase-dice" type="button" aria-label="增加骰子">＋</button>
        </div>
        <button class="roll-button" id="roll-button" type="button">
          <span class="button-icon">↻</span> 擲骰子
        </button>
      </div>
    </section>

    <section class="history-panel" aria-labelledby="history-title">
      <div class="history-heading">
        <div>
          <span class="section-label">RECENT ROLLS</span>
          <h2 id="history-title">最近紀錄</h2>
        </div>
        <button class="clear-button" id="clear-history" type="button">清除紀錄</button>
      </div>
      <div class="history-list" id="history-list">
        <p class="empty-state">開始擲骰後，結果會出現在這裡。</p>
      </div>
    </section>

    <footer>每一次結果，都是新的可能。</footer>
  </main>
</body>
</html>
