<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>命運一手｜擲骰子</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="site-header">
      <img class="brand-mark" src="nths.png" alt="楠梓高中校徽">
      <div>
        <p class="eyebrow">THREE DICE / ONE MOMENT</p>
        <h1>楠梓高中命運一手</h1>
      </div>
      <div class="header-rule" aria-hidden="true"></div>
    </header>

    <section class="game-layout" aria-label="擲骰子遊戲">
      <div class="play-area">
        <div class="section-heading">
          <p class="eyebrow">ROLL THE DICE</p>
          <h2>把下一步交給命運</h2>
        </div>

        <div class="dice-stage" aria-live="polite" aria-label="目前骰子結果">
          <div class="die-wrap">
            <span class="die-label">D1</span>
            <div class="die" id="die-1" data-value="1" aria-label="第一顆骰子：1點"></div>
          </div>
          <div class="die-wrap">
            <span class="die-label">D2</span>
            <div class="die" id="die-2" data-value="1" aria-label="第二顆骰子：1點"></div>
          </div>
          <div class="die-wrap">
            <span class="die-label">D3</span>
            <div class="die" id="die-3" data-value="1" aria-label="第三顆骰子：1點"></div>
          </div>
        </div>

        <div class="result-line">
          <span>本次總和</span>
          <strong id="total">3</strong>
        </div>

        <button class="roll-button" id="roll-button" type="button">
          <span>擲出命運</span>
          <span class="button-arrow" aria-hidden="true">↗</span>
        </button>
      </div>

      <aside class="history-panel" aria-label="擲骰紀錄">
        <div class="history-heading">
          <div>
            <p class="eyebrow">ROLL LOG</p>
            <h2>擲骰紀錄</h2>
          </div>
          <span class="roll-count" id="roll-count">0 次</span>
        </div>
        <div class="history-list" id="history-list">
          <p class="empty-state">還沒有紀錄<br><span>準備好就按下擲骰</span></p>
        </div>
        <button class="clear-button" id="clear-button" type="button" disabled>清除紀錄</button>
      </aside>
    </section>

    <footer class="site-footer">
      <span>三骰 · 六面 · 無限可能</span>
      <span>EST. 2026</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
